<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Align Studio | Precision Code Compare &amp; Beautifier</title>

    <script>
      // Synchronously set initial dark mode to prevent flash
      try {
        const saved = localStorage.getItem('kollidr-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || !saved) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>

    <style>
      #app-splash-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s ease;
      }

      html.dark #app-splash-loader {
        background-color: #09090b;
        color: #f4f4f5;
      }

      .splash-box {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 2.5rem 3rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.85);
        border: 2px solid #e4e4e7;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(8px);
      }

      html.dark .splash-box {
        background: rgba(24, 24, 27, 0.85);
        border: 2px solid #27272a;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      }

      .splash-logo-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #18181b;
        border: 2px solid #000;
        box-shadow: 3px 3px 0px 0px #ff6b00;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      html.dark .splash-logo-wrap {
        background: #09090b;
        border: 2px solid #3f3f46;
      }

      .splash-laser-beam {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 107, 0, 0.5), transparent);
        animation: splash-laser-sweep 2s infinite ease-in-out;
      }

      @keyframes splash-laser-sweep {
        0% { left: -100%; }
        50%, 100% { left: 100%; }
      }

      .splash-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .splash-badge {
        font-size: 0.65rem;
        font-family: monospace;
        font-weight: 800;
        color: #ff6b00;
        background: rgba(255, 107, 0, 0.12);
        border: 1px solid rgba(255, 107, 0, 0.25);
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .splash-progress-track {
        width: 200px;
        height: 4px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      html.dark .splash-progress-track {
        background: rgba(255, 255, 255, 0.08);
      }

      .splash-progress-bar {
        position: absolute;
        top: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #ff6b00, #ff944d);
        border-radius: 9999px;
        animation: splash-indeterminate 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 10px rgba(255, 107, 0, 0.8);
      }

      @keyframes splash-indeterminate {
        0% { left: -40%; width: 30%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 30%; }
      }

      .splash-status {
        font-size: 0.75rem;
        font-family: monospace;
        color: #71717a;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .splash-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #ff6b00;
        animation: splash-pulse 1.2s infinite ease-in-out;
      }

      @keyframes splash-pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      #app-splash-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Instant Pre-Hydration Branded Splash Loader -->
    <div id="app-splash-loader">
      <div class="splash-box">
        <div class="splash-logo-wrap">
          <div class="splash-laser-beam"></div>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="2" x2="12" y2="22" stroke="#ff6b00" stroke-width="2" stroke-dasharray="2 2" />
            <line x1="4" y1="12" x2="20" y2="12" stroke="#ff6b00" stroke-width="2.5" />
            <path d="M8 6H5a2 2 0 0 0-2 2v8a2 2 0 0 2 2h3" stroke="#ffffff" stroke-width="2.5" />
            <path d="M16 6h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3" stroke="#ffffff" stroke-width="2.5" />
            <circle cx="12" cy="12" r="2.2" fill="#ff6b00" stroke="#ffffff" stroke-width="1" />
          </svg>
        </div>

        <div class="splash-title">
          <span>Align</span>
          <span class="splash-badge">Studio</span>
        </div>

        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>

        <div class="splash-status">
          <span class="splash-dot"></span>
          <span>Aligning Precision Engine...</span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
